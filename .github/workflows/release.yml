name: Image

# 预构建镜像，发布到 GHCR。一行命令安装（get.sh）拉的就是这里的产物，
# 用户机器上不再需要源码，也不用在树莓派上从头构建几分钟。
#
#   推到 main      → :edge  和 :sha-<短哈希>   （跟着开发走，可能不稳）
#   打 vX.Y.Z 标签 → :latest、:X.Y.Z、:X.Y    （get.sh 默认用 :latest）
#
# 首次发布后，GHCR 上的包默认是私有的，要到仓库的 Packages 页面改成 Public 一次，
# 否则别人 docker pull 会被拒。

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & push (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 只有最后一层（apt 和拷文件）在 QEMU 里跑，JS 构建钉在构建机原生架构上，见 Dockerfile
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR 的镜像名必须全小写
          images: ghcr.io/${{ github.repository_owner }}/bambu-p2s-bridge
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
