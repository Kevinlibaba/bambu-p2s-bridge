name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上新的推送会取消仍在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Bridge · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
        working-directory: bridge
      - name: tsc --noEmit
        run: npx tsc -p tsconfig.json --noEmit
        working-directory: bridge
      - name: Build
        run: npm run build
        working-directory: bridge

  app:
    name: App · build (H5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build H5
        run: npm run build:h5
        working-directory: app
      - name: Check output exists
        run: test -f app/dist/build/h5/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: h5-build
          path: app/dist/build/h5
          retention-days: 7

  probes:
    name: Probes · syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile check
        run: python -m compileall -q probes
      - name: Probes must run with stdlib only
        run: |
          # 无第三方依赖时仍应打印用法并以非零码退出
          for f in probes/probe*.py; do
            out=$(python "$f" 2>&1) && { echo "::error::$f 无参数时未退出非零"; exit 1; }
            echo "$out" | grep -q "用法" || { echo "::error::$f 未打印用法"; exit 1; }
          done
          echo "所有探针 OK"

  docker:
    name: Docker · image builds
    runs-on: ubuntu-latest
    needs: [bridge, app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: h5-build
          path: bridge/public
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./bridge
          push: false
          load: true
          tags: bambu-bridge:ci
      - name: Container starts and reports missing config
        run: |
          # 无凭据时应快速失败并说明原因，而不是静默挂起
          set +e
          out=$(docker run --rm bambu-bridge:ci 2>&1); code=$?
          set -e
          echo "$out"
          [ $code -ne 0 ] || { echo "::error::缺少环境变量时未失败"; exit 1; }
          echo "$out" | grep -q "BAMBU_HOST" || { echo "::error::未提示缺失的变量名"; exit 1; }

  secrets:
    name: Guard · no credentials committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: |
          # 这个仓库的凭据只应存在于 .env（不入库）。任何看起来像真实
          # 访问码 / token / 私网地址的东西都应拦下。
          fail=0
          check() {
            hits=$(git ls-files -z | xargs -0 grep -Il -E "$1" 2>/dev/null || true)
            if [ -n "$hits" ]; then echo "::error::命中 $2: $hits"; fail=1; fi
          }
          check 'BAMBU_ACCESS_CODE=[0-9a-zA-Z]{6,}'  '硬编码访问码'
          check 'API_TOKEN=[0-9a-f]{16,}'            '硬编码 API token'
          check '\.ts\.net' '真实 tailnet 域名'
          check '192\.168\.[0-9]+\.[0-9]{1,3}:(8883|990|322)' '真实打印机地址'
          [ $fail -eq 0 ] && echo "未发现凭据泄漏"
          exit $fail
