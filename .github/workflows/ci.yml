name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上新的推送会取消仍在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Bridge · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
        working-directory: bridge
      - name: tsc --noEmit
        # npm run typecheck 同时检查源码与测试工程，后者只跑 tsc -p tsconfig.json 查不到
        run: npm run typecheck
        working-directory: bridge
      - name: Unit tests
        run: npm test
        working-directory: bridge
      - name: Build
        run: npm run build
        working-directory: bridge

  app:
    name: App · build (H5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: vue-tsc --noEmit
        run: npx vue-tsc --noEmit
        working-directory: app
      - name: 单元测试（缩放手势的数学部分）
        run: npm test
        working-directory: app
      - name: Build H5
        run: npm run build:h5
        working-directory: app
      - name: Check output exists
        run: test -f app/dist/build/h5/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: h5-build
          path: app/dist/build/h5
          retention-days: 7

  probes:
    name: Probes · syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile check
        run: python -m compileall -q probes
      - name: Probes must run with stdlib only
        run: |
          # 无第三方依赖时仍应打印用法并以非零码退出
          for f in probes/probe*.py; do
            out=$(python "$f" 2>&1) && { echo "::error::$f 无参数时未退出非零"; exit 1; }
            echo "$out" | grep -q "用法" || { echo "::error::$f 未打印用法"; exit 1; }
          done
          echo "所有探针 OK"

  docker:
    name: Docker · image builds
    runs-on: ubuntu-latest
    needs: [bridge, app]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # 上下文是仓库根目录，前端由 Dockerfile 自己构建 ——
      # 这样 CI 构建的就是用户 docker compose up --build 得到的同一个东西，
      # 而不是把 CI 里另外产出的 H5 产物塞进去。
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bridge/Dockerfile
          push: false
          load: true
          tags: bambu-bridge:ci
      - name: Unconfigured container starts in setup mode
        run: |
          # 没有打印机配置时不该退出，而是进入设置模式、只提供网页向导（一行命令安装后的状态）
          docker run -d --name setup -p 18080:8080 -e BRIDGE_CONFIG=/tmp/none.json bambu-bridge:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1 && break; sleep 1; done
          docker logs setup
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"setup":true' || { echo "::error::没有进入设置模式"; exit 1; }
          curl -fsS http://127.0.0.1:18080/api/setup/status | grep -q '"needed":true' || { echo "::error::向导状态不对"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:18080/app/ || { echo "::error::网页没出来"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/state)
          [ "$code" = 503 ] || { echo "::error::设置模式下其余接口应当 503，实际 $code"; exit 1; }
          docker rm -f setup

  ha-addon:
    name: Home Assistant add-on · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # HA 社区通用的加载项检查：config.yaml 的键、类型、架构名都按 Supervisor 的规则校验
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./bambu_p2s_bridge

  secrets:
    name: Guard · no credentials committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 .github/scripts/check-secrets.py

  i18n:
    name: Guard · locale keys stay in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 .github/scripts/check-i18n.py
