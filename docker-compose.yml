services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro

  bridge:
    # 有了 image 这一行，./install.sh --pull 或 docker compose pull 可以直接用预构建镜像；
    # docker compose up -d --build 仍然从源码构建（产物也用这个名字）。
    image: ghcr.io/kevinlibaba/bambu-p2s-bridge:${BRIDGE_TAG:-latest}
    # 上下文是仓库根目录：前端和桥接在同一次构建里完成，
    # 宿主机不需要装 Node，也不用手动把产物拷进 bridge/public
    build:
      context: .
      dockerfile: bridge/Dockerfile
    container_name: bambu-bridge
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      # 推送订阅与打印历史落在这里，容器重建后要保住
      - ./data:/data
      # BambuStudio 解包后 540MB，不进镜像 —— 进了镜像每次重建都要重传一遍，
      # 而它是个几乎不变的第三方产物。只读挂载，切片时只从里面读 profile 和二进制。
      # 目录不存在时切片功能自动关闭（见 config.slicer.root），其余功能不受影响。
      - /opt/slicer:/opt/slicer:ro
    depends_on:
      - go2rtc
