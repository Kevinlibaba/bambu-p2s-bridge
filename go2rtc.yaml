# go2rtc 自身没有鉴权机制，因此 API 只监听回环地址，
# 对外一律经桥接服务的鉴权代理。切勿改成 0.0.0.0。
api:
  listen: "127.0.0.1:1984"

rtsp:
  listen: "127.0.0.1:8554"

webrtc:
  listen: ":8555"

log:
  level: info

# 打印机的视频流不写在这里：桥接启动后通过 go2rtc 的 API 注册（见 bridge/src/printer/camera.ts），
# 凭据只放在桥接一处。这样网页设置向导配置的打印机也能直接出画面，go2rtc 不需要读 .env。
streams: {}
